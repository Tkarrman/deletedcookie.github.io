<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080908" />
  <meta
    name="description"
    content="Watch the Plague Crew concept trailer — a chaotic co-op survival comedy horror from Deleted Cookie."
  />
  <title>Plague Crew — Concept Trailer</title>

  <style>
    :root {
      color-scheme: dark;
      --ink: #080908;
      --bone: #f1eadc;
      --muted: #b7ad9c;
      --moss: #a7c76b;
      --rust: #b5654f;
      --line: rgba(241, 234, 220, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--bone);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 13% 12%, rgba(167, 199, 107, 0.15), transparent 30rem),
        radial-gradient(circle at 87% 16%, rgba(181, 101, 79, 0.12), transparent 28rem),
        linear-gradient(145deg, #080908 0%, #10130e 55%, #070807 100%);
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: 0.2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 40px));
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(32px, 6vh, 72px) 0;
      display: grid;
      align-content: center;
      gap: clamp(22px, 4vh, 38px);
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
    }

    .logo {
      width: clamp(210px, 30vw, 330px);
      height: auto;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.55));
    }

    .label {
      margin: 0 0 0.15rem;
      color: var(--moss);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .video-shell {
      position: relative;
      padding: clamp(7px, 1vw, 12px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: clamp(16px, 2vw, 26px);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025));
      box-shadow:
        0 36px 100px rgba(0, 0, 0, 0.58),
        0 0 70px rgba(167, 199, 107, 0.06);
    }

    .video-shell::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background: linear-gradient(110deg, rgba(167, 199, 107, 0.2), transparent 35%, rgba(181, 101, 79, 0.18));
      filter: blur(24px);
    }

    .video {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: clamp(11px, 1.4vw, 18px);
      background: #000;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }

    footer span:last-child {
      color: rgba(241, 234, 220, 0.46);
    }

    @media (max-width: 600px) {
      main {
        width: min(100% - 24px, 1120px);
        padding: 24px 0;
      }

      header {
        align-items: center;
      }

      .logo {
        width: min(58vw, 250px);
      }

      .label {
        font-size: 0.62rem;
        letter-spacing: 0.12em;
      }

      footer {
        justify-content: center;
      }

      footer span:last-child {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <img class="logo" src="../PlagueDoctor/image5.png" alt="Plague Crew" />
      <p class="label">Concept trailer</p>
    </header>

    <div class="video-shell">
      <div class="video">
        <iframe
          src="https://www.youtube-nocookie.com/embed/h5owLUcPCSk?rel=0"
          title="Plague Crew concept trailer"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <footer>
      <span>Chaotic co-op survival comedy horror</span>
      <span>Deleted Cookie AB</span>
    </footer>
  </main>
</body>
</html>
