<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Max Nafar | Portfolio</title>
  <link rel="stylesheet" href="../shared/portfolio.css">
  <link rel="stylesheet" href="../shared/framework.css">

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header shell">
    <a class="wordmark" href="../"><img class="brand-logo" src="../shared/image/DeletedCookieLogo.png" alt="Deleted Cookie"></a>
    <nav aria-label="Main navigation"><a href="../">Team</a><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
  </header>
  <main class="shell" id="main">
    <section class="hero" id="top" aria-labelledby="name">
      <div><p class="eyebrow">Portfolio</p><h1 id="name">Max<br>Nafar</h1><!-- Add approved role and introduction here. --></div>
      <div class="portrait-area"><div class="portrait-placeholder" role="img" aria-label="Portrait placeholder"><span class="placeholder-icon" aria-hidden="true">＋</span></div><span class="petal petal-one" aria-hidden="true"></span><span class="petal petal-two" aria-hidden="true"></span></div>

    <section class="section framework-panel" id="about" aria-labelledby="about-title"><h2 id="about-title">About</h2><!-- Add approved biography here. --><div class="empty-area" aria-hidden="true"></div></section>

  <footer class="shell"><span>Max Nafar</span><a href="#top">Back to top ↑</a></footer>
